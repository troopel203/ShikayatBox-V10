<style>
:root{--red:#D91E2E;--red2:#B5121F;--navy:#14126B;--navy2:#0B0B3B;--bg:#F4F5F9;--card:#fff;--tx:#1d2233;--mu:#5d6478;--ln:#E3E5EE;--gr:#1E8E4E;--am:#E0A020}
*{box-sizing:border-box}html,body{margin:0}

button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.tri{height:5px;background:linear-gradient(90deg,#FF9933 33%,#fff 33% 66%,#138808 66%)}
.strip{background:var(--navy2);color:#dfe2f5;font-size:12px}
.strip .in{display:flex;justify-content:flex-end;gap:14px;align-items:center;padding:6px 16px;flex-wrap:wrap}
.strip button,.strip select{color:#dfe2f5;background:none;border:1px solid #4a4d8a;border-radius:4px;font-size:12px;padding:2px 8px}
.strip select option{color:#000}
header.top{background:#fff;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.top .in{display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.emb{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid #FF9933}
.logo b{font-size:24px;color:var(--navy);letter-spacing:-.5px;display:block;line-height:1}
.logo small{font-size:11px;color:var(--mu)}
.sbox{flex:1;min-width:220px;display:flex;border:1.5px solid #c9ccdc;border-radius:6px;overflow:hidden;max-width:560px;margin-left:auto}
.sbox input{flex:1;border:0;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;min-width:0}
.sbox button,.btn{background:var(--red);color:#fff;border:0;padding:10px 20px;font-weight:700;font-size:14px;border-radius:6px}
.sbox button{border-radius:0}.btn:hover,.sbox button:hover{background:var(--red2)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.navy{background:var(--navy)}.btn.sm{padding:6px 12px;font-size:12px}.btn:disabled{opacity:.6}
nav.tabs{background:#fff;border-bottom:1px solid var(--ln)}
nav.tabs .wrap{display:flex;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;font-weight:700;font-size:14px;color:var(--mu);white-space:nowrap}
nav.tabs button.on{color:var(--red);border-color:var(--red)}
.hero{background:linear-gradient(160deg,#14126B,#2a1f7a 55%,#5a1f5a);color:#fff;padding:44px 0 80px;text-align:center}
.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 6px;font-weight:800;letter-spacing:-1px}
.hero h1 span{border-bottom:5px solid;border-image:linear-gradient(90deg,#FF9933 33%,#fff 33% 66%,#138808 66%) 1}
.hero p{margin:6px auto 22px;font-size:17px;max-width:640px;opacity:.95}
.hsearch{display:flex;max-width:720px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden}
.hsearch input{flex:1;border:0;padding:16px;font-size:16px;outline:none;min-width:0;font-family:inherit}
.hsearch button{border-radius:0;padding:0 28px;font-size:17px}
.trend{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:13px}
.trend button{background:transparent;color:#fff;border:1px solid #9a9bd0;border-radius:4px;padding:6px 12px;font-size:13px}
.trend button:hover{background:rgba(255,255,255,.14)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#fff;border-radius:10px;padding:18px;margin:-46px 0 26px;box-shadow:0 8px 28px rgba(20,18,107,.14);position:relative}
.stat{display:flex;gap:10px;align-items:center;cursor:pointer}
.stat .ic{font-size:30px}.stat b{font-size:26px;display:block;line-height:1;color:var(--navy)}.stat span{font-size:12.5px;color:var(--mu)}
.svc{display:grid;grid-template-columns:1.05fr 1fr;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.07);margin-bottom:26px}
.svc .l{background:var(--red);color:#fff;padding:26px}
.svc h2{margin:0 0 4px;font-size:28px}.svc h2:after{content:"";display:block;width:70px;height:3px;background:#fff;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.tile{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:4px;padding:16px 8px;text-align:center;font-size:12.5px;font-weight:600}
.tile:hover{background:rgba(255,255,255,.24)}.tile .e{font-size:28px;display:block;margin-bottom:6px}
.pill{background:#fff;color:var(--red);border:0;border-radius:99px;padding:9px 22px;font-weight:700}
.svc .r{background:#fff;padding:22px}
h3.sec{font-size:22px;margin:0 0 4px;color:var(--tx)}h3.sec:after{content:"";display:block;width:56px;height:3px;background:var(--red);margin-top:5px}
.panel{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.step{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:16px;border-top:4px solid var(--red)}
.step i{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:8px}
.lbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:14px 0 6px}
.inp{width:100%;border:1.5px solid #c9ccdc;border-radius:6px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--tx)}
.inp:focus{outline:2px solid var(--navy);outline-offset:1px}textarea.inp{min-height:90px;resize:vertical}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{background:#fff;border:1.5px solid #c9ccdc;border-radius:8px;padding:12px;text-align:left;display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;color:var(--tx)}
.cat.on{border-color:var(--red);background:#fff4f5;box-shadow:inset 0 0 0 1px var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid #c9ccdc;background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:16px;border-left:5px solid #c9ccdc}
.card.Critical{border-left-color:var(--red)}.card.High{border-left-color:#F08A24}.card.Medium{border-left-color:var(--am)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin:8px 0}
.tag{font-size:11px;font-weight:800;text-transform:uppercase;padding:3px 9px;border-radius:4px;border:1.5px solid;white-space:nowrap}
.up{background:#fff;border:2px solid var(--red);color:var(--red);border-radius:99px;padding:7px 16px;font-weight:800;font-size:13px}
.up.v{background:var(--red);color:#fff}.up.pop{transform:scale(1.08) rotate(-3deg)}
.ph{width:86px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
.warn{background:#FFF7E0;border:1.5px solid var(--am);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:14px}
.err{color:var(--red);font-weight:700;font-size:13px;margin:8px 0}
.ok{background:#E8F6EE;border:1px solid var(--gr);color:var(--gr);padding:10px 14px;border-radius:8px;font-weight:700;margin-bottom:10px}
.auth{max-width:430px;margin:10px auto}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.pstat{background:var(--bg);border-radius:8px;padding:12px;text-align:center}.pstat b{font-size:24px;color:var(--navy);display:block}.pstat span{font-size:12px;color:var(--mu)}
footer{background:var(--navy2);color:#cfd2ee;margin-top:30px;padding:30px 0 18px;font-size:13.5px}
footer .g{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}footer h4{color:#fff;margin:0 0 8px}footer a{color:#cfd2ee;display:block;margin:4px 0;text-decoration:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast.e{background:var(--red)}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;box-shadow:0 8px 24px rgba(217,30,46,.4);border-radius:99px;padding:14px 20px}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.svc,.grid2,.cards,footer .g{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.sbox{max-width:none;margin-left:0;width:100%}.tiles{grid-template-columns:repeat(2,1fr)}.hsearch button{padding:0 16px}}
.car{position:relative;max-width:1000px;margin:16px auto;aspect-ratio:2/1;overflow:hidden;border-radius:10px;background:#0b1440;box-shadow:0 6px 24px rgba(10,20,70,.25);outline-offset:3px;touch-action:pan-y}.ctrack{display:flex;height:100%;transition:transform .7s cubic-bezier(.4,0,.2,1)}.cs{flex:0 0 100%;position:relative;height:100%}.cbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(22px) brightness(.85);transform:scale(1.15)}.cfg{position:relative;width:100%;height:100%;object-fit:contain;user-select:none}
.cb{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#14126B;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}.cb svg{margin:0!important}.cb.l{left:10px}.cb.r{right:10px}.cb:focus-visible,.cdots button:focus-visible{outline:3px solid #E0A020}
.cdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(10,20,70,.65);padding:5px 10px;border-radius:20px}.cdots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5);cursor:pointer}.cdots button.on{background:#fff;width:22px;border-radius:6px}.cdots .cp{width:auto;height:auto;background:none;color:#fff;display:flex;border-radius:0}.cdots .cp svg{margin:0!important}
@media(max-width:600px){.cb{width:32px;height:32px}.car{border-radius:0;margin:0 0 12px;aspect-ratio:16/10}}
.ticker{background:#B71C1C;color:#fff;overflow:hidden;white-space:nowrap;font-size:13px;padding:6px 0}.ticker span{display:inline-block;padding-left:100%;animation:tk 45s linear infinite}.ticker:hover span{animation-play-state:paused}@keyframes tk{to{transform:translateX(-100%)}}
.tl{display:flex;gap:0;margin:14px 0;overflow-x:auto}.tl div{flex:1;min-width:88px;text-align:center;font-size:12px;position:relative;padding-top:26px;color:var(--mu)}.tl div:before{content:"";position:absolute;top:8px;left:0;right:0;height:4px;background:#ccd}.tl div i{position:absolute;top:0;left:50%;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:#ccd;z-index:1;color:#fff;font-style:normal;line-height:20px}.tl .d{color:#1E8E4E;font-weight:700}.tl .d:before,.tl .d i{background:#1E8E4E}
.gr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.bar{height:10px;background:#14126B;border-radius:5px}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0}}
/* v5 typography & polish: serif headings + clean sans body, red accent underline */
h1,h2,h3,h4,.logo b,.hero h1,.stats b,.pstat b{font-family:'Source Serif 4','Noto Serif Devanagari',Georgia,serif;letter-spacing:-.01em}
.hero h1{font-weight:800;line-height:1.15}h3.sec{font-weight:700;display:inline-block;border-bottom:3px solid var(--red,#B71C1C);padding-bottom:4px;margin-bottom:14px}
.tile{border-radius:3px;font-size:13px;letter-spacing:.01em}.card,.panel{border:1px solid #dfe3ee;border-radius:6px;box-shadow:0 1px 2px rgba(16,24,64,.05)}
.tabs button{font-weight:600;font-size:14px;letter-spacing:.01em}body{-webkit-font-smoothing:antialiased;font-size:15px}
.logo small{font-size:11.5px;color:var(--mu)}.strip{font-size:12px}

img{max-width:100%}.wrap{width:100%}
.car{max-width:none;width:100%;margin:0;border-radius:0;aspect-ratio:21/9;max-height:78vh;box-shadow:none}

.strip button,.strip select{min-height:26px}

  <div className="gr2" style={{marginTop:16}}><div className="panel"><h4>Department performance</h4>{by.map(x=><div key={x.k} style={{margin:'10px 0'}}><div className="row" style={{justifyContent:'space-between',fontSize:13}}><span>{DEPT[x.k]}</span><span>{x.rs}/{x.n} resolved · {x.br} SLA breaches</span></div><div className="bar" style={{width:(x.n/mx*100)+'%'}}/></div>)}</div>
  <div className="panel"><h4>How AI is used</h4><p style={{fontSize:13}}>Category: Naive Bayes on char n-grams (EN/HI/MR/Hinglish), trained on <b>synthetic</b> text. Priority: rule-based, explainable. Duplicates: 100 m geo-distance + text similarity. Low-confidence predictions are left for the citizen/officer to confirm. Retrainable on real municipal data via <code>ml/train_text_model.py</code>.</p></div></div></div>};
 const Card=({i})=>{const c=cm(i.category),v=myUp.includes(i.id),urg=i.upvotes>=URGENT&&i.status!=='resolved';
  return <div className={'card '+i.label}>
   <div className="row" style={{justifyContent:'space-between'}}>
    <b style={{fontSize:13}}>{Ic(c.e,22)} {cl(c)}</b>
    <span className="tag" style={{color:STATUS[i.status],borderColor:STATUS[i.status]}}>{stL(i.status)}</span></div>
   <div className="meta"><span>{pad(i.ticketNo)}</span><span title={i.reasons.join(', ')}>{Ic('scale')} {t('score')}: <b>{i.label} ({i.score})</b></span>{urg&&<span style={{color:'var(--red)',fontWeight:800}}>{Ic('flame')} {t('urgent')}</span>}</div>
   <div style={{margin:'6px 0',fontSize:15}}>{i.description}</div>
   {i.photos&&i.photos.length>0&&<div className="row" style={{margin:'6px 0'}}>{i.photos.map((p,k)=><img key={k} className="ph" src={p}/>)}</div>}
   <div className="meta"><span>{Ic('pin')} {i.location}</span><span>⏰ {ago(i.createdAt)}</span><span>{t('by')} {i.reporter}</span></div>
   {i.reasons.length>0&&<div style={{fontSize:11.5,color:'var(--mu)',marginBottom:8}}>{t('whyP')}: {i.reasons.join(' · ')}</div>}
   <div className="row"><button className={'up '+(v?'v ':'')+(pop===i.id?'pop':'')} disabled={v} onClick={()=>upvote(i.id)}>{Ic('thumb')} {i.upvotes} {v?t('upd'):t('up')}</button>
    <button className="btn ghost sm" onClick={()=>share(i)}>{Ic('megaphone')} {t('share')}</button></div></div>};

 const fil=scored.filter(i=>(fCat==='all'||i.category===fCat)&&(fSt==='all'||(fSt==='open'?i.status!=='resolved':i.status==='resolved'))&&(!q||(i.description+' '+i.location+' '+i.reporter+' '+pad(i.ticketNo)).toLowerCase().includes(q.toLowerCase())))
  .sort((a,b)=>sort==='up'?b.upvotes-a.upvotes:sort==='recent'?b.createdAt-a.createdAt:b.score-a.score);
 const mine=scored.filter(i=>user&&(i.userId===user.id||(i.reporterEmail&&i.reporterEmail===user.email))).sort((a,b)=>b.createdAt-a.createdAt);
 const tabs=[['home','nHome'],['track','nTrack'],['map','nMap'],['report','nReport'],['feed','nFeed'],['profile','nProfile'],['desk','nDesk'],['about','nAbout']];

 return <div>
  <div className="ticker" role="marquee" aria-label="Alerts"><span>{Ic('alert')} Monsoon alert: report waterlogging &amp; open manholes immediately &nbsp;•&nbsp; Emergency: 112 &nbsp;•&nbsp; Animal rescue helpline available 24x7 &nbsp;•&nbsp; Every ticket has an SLA timer &nbsp;•&nbsp; Track your complaint by Ticket ID &nbsp;•&nbsp; Demo build — not an official government service</span></div>
  <div className="tri"/>
  <div className="strip"><div className="in"><a href="#main" style={{color:'#dfe2f5'}}>{t('skip')}</a><span>|</span>
   <button onClick={()=>setFs(f=>Math.max(12,f-1))} aria-label="Decrease text size">A-</button><button onClick={()=>setFs(16)} aria-label="Reset text size">A</button><button onClick={()=>setFs(f=>Math.min(22,f+1))} aria-label="Increase text size">A+</button><button onClick={()=>setDark(d=>!d)} aria-label="Toggle dark mode" aria-pressed={dark}>{dark?'Light':'Dark'}</button>
   <select value={lang} onChange={e=>{setLang(e.target.value);LS.set('sb-lang',e.target.value)}}><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select></div></div>
  <header className="top"><div className="wrap in">
   <div className="logo" onClick={()=>go('home')}><div className="emb">{Ic('megaphone')}</div><div><b>ShikayatBox</b><small>{t('tag')}</small></div></div>
   <div className="sbox"><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&heroSearch()} placeholder={t('searchPh')}/><button onClick={heroSearch}>{t('search')}</button></div>
   <button className="btn ghost sm" onClick={()=>go('profile')}>{Ic('user')} {user?user.name.split(' ')[0]:t('signIn')}</button></div></header>
  <nav className="tabs"><div className="wrap">{tabs.map(([k,l])=><button key={k} className={tab===k?'on':''} onClick={()=>go(k)}>{t(l)}</button>)}</div></nav>

  <main id="main">
  {tab==='home'&&<div>
   <Carousel/>
  <section className="hero"><div className="wrap"><h1><span>{t('hero')}</span></h1><p>{t('heroSub')}</p>
    <div className="hsearch"><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&heroSearch()} placeholder={t('searchPh')}/><button className="btn" onClick={heroSearch}>{t('search')}</button></div>
    <div className="trend"><span>{t('trending')}</span>{CATS.slice(0,5).map(c=><button key={c.id} onClick={()=>{setFCat(c.id);go('feed')}}>{Ic(c.e,22)} {t('c_'+c.id)}</button>)}</div></div></section>
   <div className="wrap">
    <div className="stats">{[[Ic('clip'),total,'sRep',()=>{setFSt('all');go('feed')}],[Ic('thumb'),ups,'sUp',()=>{setSort('up');go('feed')}],[Ic('check'),res,'sRes',()=>{setFSt('resolved');go('feed')}],[Ic('clock'),total-res,'sOpen',()=>{setFSt('open');go('feed')}],[Ic('pin'),places,'sLoc',()=>go('about')]].map(([ic,n,l,f])=>
      <div key={l} className="stat" onClick={f}><div className="ic">{ic}</div><div><b>{n}</b><span>{t(l)}</span></div></div>)}</div>
    <div className="svc"><div className="l"><h2>{t('svcT')}</h2><p style={{margin:'10px 0 0'}}>{t('svcS')}</p>
      <div className="tiles">{CATS.map(c=><button key={c.id} className="tile" onClick={()=>{setCat(c.id);go('report')}}><span className="e">{Ic(c.e,22)}</span>{t('c_'+c.id)}</button>)}</div>
      <button className="pill" onClick={()=>go('report')}>{t('svcB')} →</button></div>
     <div className="r"><h3 className="sec">{t('latest')}</h3><div style={{marginTop:14,display:'grid',gap:10}}>
      {scored.length===0&&<p style={{color:'var(--mu)'}}>{t('none')}</p>}
      {[...scored].sort((a,b)=>b.score-a.score).slice(0,3).map(i=><div key={i.id} style={{borderBottom:'1px solid var(--ln)',paddingBottom:8}}>
        <b>{Ic(cm(i.category).e)} {cl(cm(i.category))}</b> <span style={{color:'var(--mu)',fontSize:12}}>· {i.label} ({i.score}) · {Ic('thumb')} {i.upvotes}</span><div style={{fontSize:14}}>{i.description.slice(0,110)}</div></div>)}
      <button className="btn ghost sm" style={{justifySelf:'start'}} onClick={()=>go('feed')}>{t('viewAll')}</button></div></div></div>
    <h3 className="sec" style={{marginBottom:14}}>{t('howT')}</h3>
    <div className="steps">{[1,2,3,4].map(n=><div key={n} className="step"><i>{n}</i><b>{t('h'+n)}</b><div style={{fontSize:13,color:'var(--mu)'}}>{t('h'+n+'d')}</div></div>)}</div>
   </div></div>}

  {tab==='report'&&<div className="wrap" style={{padding:'22px 16px',maxWidth:820}}><div className="panel">
   <h3 className="sec">{t('nReport')}</h3>
   <span className="lbl">{t('s1')}</span><div className="cats">{allCats.map(c=><button key={c.id} className={'cat'+(cat===c.id?' on':'')} onClick={()=>setCat(c.id)}><span style={{fontSize:22}}>{Ic(c.e,22)}</span>{cl(c)}</button>)}</div>
   <div className="row" style={{marginTop:8}}><input className="inp" style={{flex:1,minWidth:150}} placeholder={t('addCat')} value={newCat} onChange={e=>setNewCat(e.target.value)}/><button className="btn ghost sm" onClick={addCat}>＋</button></div>
   <span className="lbl">{t('s2')}</span><textarea className="inp" placeholder={t('descPh')} value={desc} onChange={e=>setDesc(e.target.value)}/>
   <div className="row" style={{marginTop:6}}><button className="btn ghost sm" onClick={voice}>{listen?t('listening'):t('voice')}</button>
    {hint&&<span style={{fontSize:13}}>{Ic('cpu')} {t('sugg')}: <b>{cl(cm(hint))}</b> <button className="btn sm navy" onClick={()=>setCat(hint)}>{t('apply')}</button></span>}</div>
   <span className="lbl">{t('s3')}</span><div className="row"><input className="inp" style={{flex:1,minWidth:180}} placeholder={t('locPh')} value={loc} onChange={e=>setLoc(e.target.value)}/><button className="btn navy sm" onClick={locate} disabled={locBusy}>{locBusy?t('locating'):<>{Ic('locate')}{t('useLoc')}</>}</button></div>
   <MapPick coords={coords} onPick={pickMap}/>
   <span className="lbl">{t('s4')}</span><input type="file" accept="image/*" multiple onChange={pickPhotos}/>
   {photos.length>0&&<div className="row" style={{marginTop:8}}>{photos.map((p,k)=><div key={k} style={{position:'relative'}}><img className="ph" src={p}/><button onClick={()=>setPhotos(photos.filter((_,j)=>j!==k))} style={{position:'absolute',top:2,right:2,background:'#000a',color:'#fff',border:0,borderRadius:4}}>✕</button></div>)}</div>}
   <span className="lbl">{t('s5')}</span><div className="row">{['low','normal','urgent','immediate'].map(p=><button key={p} className={'chip'+(prio===p?' on':'')} onClick={()=>setPrio(p)}>{prL(p)}</button>)}</div>
   <span className="lbl">{t('s6')}</span>
   <div className="grid2"><input className="inp" placeholder={t('email')} value={rMail} onChange={e=>setRMail(e.target.value)}/><input className="inp" placeholder={t('phone')} value={rPhone} onChange={e=>setRPhone(e.target.value)}/></div>
   <input className="inp" style={{marginTop:10}} placeholder={t('yourName')} value={rName} disabled={anon} onChange={e=>setRName(e.target.value)}/>
   <label style={{display:'block',margin:'10px 0',fontSize:14}}><input type="checkbox" checked={anon} onChange={e=>setAnon(e.target.checked)}/> {t('anon')}</label>
   {dupes.length>0&&<div className="warn"><b>{Ic('alert')} {t('dupT')}</b><div style={{fontSize:13,margin:'4px 0 8px'}}>{t('dupB')}</div>
     {dupes.map(({i,why})=><div key={i.id} className="row" style={{justifyContent:'space-between',borderTop:'1px solid #ead9a0',padding:'6px 0'}}><span style={{fontSize:13}}><b>{pad(i.ticketNo)}</b> · {why} · {i.description.slice(0,60)}</span><button className="btn sm" onClick={()=>{upvote(i.id);setDupes([]);go('feed')}}>{t('dupUp')}</button></div>)}
     <button className="btn ghost sm" style={{marginTop:8}} onClick={()=>submit(true)}>{t('dupAny')}</button></div>}
   {err&&<div className="err">{err}</div>}
   <button className="btn" style={{width:'100%',fontSize:16,padding:14}} disabled={busy} onClick={()=>submit()}>{busy?t('submitting'):t('submit')}</button>
   <p style={{fontSize:12,color:'var(--mu)'}}>{t('mailNote')}</p></div></div>}

  {tab==='feed'&&<div className="wrap" style={{padding:'22px 16px'}}>
   <div className="row" style={{marginBottom:12}}>
    <button className={'chip'+(fCat==='all'?' on':'')} onClick={()=>setFCat('all')}>{t('all')}</button>
    {allCats.map(c=><button key={c.id} className={'chip'+(fCat===c.id?' on':'')} onClick={()=>setFCat(c.id)}>{Ic(c.e,22)} {cl(c)}</button>)}</div>
   <div className="row" style={{marginBottom:14}}>
    {[['all','all'],['open','open'],['resolved','resolved']].map(([k,l])=><button key={k} className={'chip'+(fSt===k?' on':'')} onClick={()=>setFSt(k)}>{t(l)}</button>)}
    <input className="inp" style={{maxWidth:280,marginLeft:'auto'}} placeholder={t('searchPh')} value={q} onChange={e=>setQ(e.target.value)}/>
    <select className="inp" style={{width:'auto'}} value={sort} onChange={e=>setSort(e.target.value)}><option value="up">{t('mostUp')}</option><option value="recent">{t('recent')}</option><option value="score">{t('topPri')}</option></select></div>
   {fil.length===0?<div className="panel" style={{textAlign:'center',color:'var(--mu)'}}>{t('none')}</div>:<div className="cards">{fil.map(i=><Card key={i.id} i={i}/>)}</div>}</div>}

  {tab==='profile'&&<div className="wrap" style={{padding:'22px 16px',maxWidth:860}}>
   {!user?<div className="auth"><div className="panel" style={{textAlign:'center'}}>
     <div style={{fontSize:38}}>{Ic('user',38)}</div><h3 style={{margin:'6px 0'}}>{mode==='in'?t('signIn'):t('signUp')}</h3><p style={{color:'var(--mu)',fontSize:13}}>{t('aTag')}</p>
     <div style={{textAlign:'left',display:'grid',gap:10}}>
      {mode==='up'&&<input className="inp" placeholder={t('name')} value={aN} onChange={e=>setAN(e.target.value)}/>}
      <input className="inp" type="email" placeholder={t('email').replace(' (optional)','')} value={aE} onChange={e=>setAE(e.target.value)}/>
      {mode==='up'&&<input className="inp" placeholder={t('phone')} value={aP} onChange={e=>setAP(e.target.value)}/>}
      <input className="inp" type="password" placeholder={t('pass')} value={aPw} onChange={e=>setAPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&mode==='in'&&signIn()}/>
      {mode==='up'&&<input className="inp" type="password" placeholder={t('pass2')} value={aPw2} onChange={e=>setAPw2(e.target.value)}/>}
      {aErr&&<div className="err">{aErr}</div>}
      <button className="btn" onClick={mode==='in'?signIn:signUp}>{mode==='in'?t('signIn'):t('signUp')}</button></div>
     <p style={{color:'var(--red)',fontWeight:700,cursor:'pointer',fontSize:13}} onClick={()=>{setMode(mode==='in'?'up':'in');setAErr('')}}>{mode==='in'?t('sw1'):t('sw2')}</p></div></div>
   :<div className="panel">
     <div className="row" style={{gap:16}}><div className="avatar">{user.name.charAt(0).toUpperCase()}</div>
      <div style={{flex:1}}>{!editing?<div><h3 style={{margin:0}}>{user.name}</h3><div style={{color:'var(--mu)',fontSize:13}}>{user.email}{user.phone?' · '+user.phone:''}</div></div>
       :<div className="row"><input className="inp" style={{maxWidth:200}} value={eN} onChange={e=>setEN(e.target.value)}/><input className="inp" style={{maxWidth:200}} value={eP} onChange={e=>setEP(e.target.value)}/></div>}</div>
      <div className="row">{!editing?<button className="btn ghost sm" onClick={()=>{setEN(user.name);setEP(user.phone||'');setEditing(true)}}>{t('edit')}</button>:<><button className="btn sm" onClick={saveProfile}>{t('save')}</button><button className="btn ghost sm" onClick={()=>setEditing(false)}>{t('cancel')}</button></>}
       <button className="btn navy sm" onClick={logout}>{t('signOut')}</button></div></div>
     <div className="pstats"><div className="pstat"><b>{mine.length}</b><span>{t('filed')}</span></div><div className="pstat"><b>{mine.reduce((s,i)=>s+i.upvotes,0)}</b><span>{t('recv')}</span></div><div className="pstat"><b>{mine.filter(i=>i.status==='resolved').length}</b><span>{t('resN')}</span></div></div>
     <h3 className="sec" style={{marginBottom:12}}>{t('mine')}</h3>
     {mine.length===0?<p style={{color:'var(--mu)'}}>{t('noMine')}</p>:<div className="cards">{mine.map(i=><Card key={i.id} i={i}/>)}</div>}</div>}</div>}

  {tab==='track'&&Track()}
  {tab==='map'&&Transparency()}
  {tab==='desk'&&<div className="wrap" style={{padding:'22px 16px'}}>
   {!deskOk?<div className="auth"><div className="panel" style={{textAlign:'center'}}><div style={{fontSize:34}}>{Ic('lock',34)}</div><h3>{t('deskT')}</h3>
     <input className="inp" type="password" placeholder={t('pw')} value={deskPw} onChange={e=>setDeskPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(deskPw===ADMIN_PW?setDeskOk(true):setDeskErr(t('badPw')))}/>
     {deskErr&&<div className="err">{deskErr}</div>}<button className="btn" style={{marginTop:10,width:'100%'}} onClick={()=>deskPw===ADMIN_PW?(setDeskOk(true),setDeskErr('')):setDeskErr(t('badPw'))}>{t('enter')}</button>
     <p style={{fontSize:12,color:'var(--mu)'}}>{t('demoPw')}</p></div></div>
   :<div><div className="row" style={{marginBottom:14,justifyContent:'space-between'}}><h3 className="sec">{t('nDesk')} — {t('topPri')}</h3><div className="row"><button className="btn navy sm" onClick={csv}>⬇ {t('csv')}</button><button className="btn ghost sm" onClick={()=>setDeskOk(false)}>{t('signOut')}</button></div></div>
    <div style={{display:'grid',gap:12}}>{[...scored].sort((a,b)=>b.score-a.score).map(i=><div key={i.id} className={'card '+i.label}>
      <div className="row" style={{justifyContent:'space-between'}}><b>{Ic(cm(i.category).e)} {cl(cm(i.category))} · {pad(i.ticketNo)}</b><span><b>{i.label} ({i.score})</b> · {Ic('thumb')} {i.upvotes}</span></div>
      <div style={{margin:'6px 0'}}>{i.description}</div>{i.photos&&i.photos.length>0&&<div className="row">{i.photos.map((p,k)=><img key={k} className="ph" src={p}/>)}</div>}
      <div className="meta"><span>{Ic('pin')} {i.location}</span><span>{t('by')} {i.reporter}</span><span>{t('whyP')}: {i.reasons.join(' · ')||'—'}</span></div>
      <div className="meta"><span>{Ic('building')} {DEPT[i.category]||DEPT.other}</span><span>SLA {SLA[i.category]||72}h</span></div>{i.status==='resolved'&&<label style={{fontSize:13}}>After photo: <input type="file" accept="image/*" onChange={async e=>{const f=e.target.files[0];if(f){const d=await compress(f);persist(issues.map(x=>x.id===i.id?{...x,after:d}:x))}}}/></label>}{i.after&&i.photos&&i.photos[0]&&<div className="row"><img className="ph" src={i.photos[0]}/><span>→</span><img className="ph" src={i.after}/><span style={{fontSize:12}}>Before / After</span></div>}<select className="inp" style={{width:'auto'}} value={i.status} onChange={e=>setStatus(i.id,e.target.value)}>{Object.keys(STATUS).map(s=><option key={s} value={s}>{stL(s)}</option>)}</select></div>)}
     {issues.length===0&&<div className="panel">{t('none')}</div>}</div></div>}</div>}

  {tab==='about'&&<div className="wrap" style={{padding:'22px 16px',maxWidth:900}}>
   <div className="panel"><h3 className="sec">{t('mission')}</h3><p>{t('missionTxt')}</p></div>
   <div className="panel"><h3 className="sec" style={{marginBottom:12}}>{t('howT')}</h3><div className="steps">{[1,2,3,4].map(n=><div key={n} className="step"><i>{n}</i><b>{t('h'+n)}</b><div style={{fontSize:13,color:'var(--mu)'}}>{t('h'+n+'d')}</div></div>)}</div></div>
   <div className="panel"><h3 className="sec" style={{marginBottom:12}}>{t('impact')}</h3><div className="pstats" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
     {[[total,'sRep'],[ups,'sUp'],[res,'sRes'],[places,'sLoc']].map(([n,l])=><div key={l} className="pstat"><b>{n}</b><span>{t(l)}</span></div>)}</div><small style={{color:'var(--mu)'}}>{t('impactNote')}</small></div>
   <div className="panel"><h3 className="sec">{t('aiT')}</h3><p>{t('aiTxt')}</p></div>
   <div className="grid2"><div className="panel"><h3 className="sec" style={{marginBottom:10}}>{t('helpT')}</h3>{HELP.map(([k,n])=><a key={k} href={n} style={{display:'block',padding:'8px 0',color:'var(--navy)',fontWeight:600,borderBottom:'1px dashed var(--ln)',textDecoration:'none'}}>{Ic('phone')} {t(k)} — {n.replace('tel:','')}</a>)}</div>
    <div className="panel"><h3 className="sec" style={{marginBottom:10}}>{t('contact')}</h3>{cSent&&<div className="ok">{Ic('check')} {t('sent')}</div>}
     <div style={{display:'grid',gap:8}}><input className="inp" placeholder={t('cName')} value={cN} onChange={e=>setCN(e.target.value)}/><input className="inp" type="email" placeholder={t('cMail')} value={cE} onChange={e=>setCE(e.target.value)}/><textarea className="inp" placeholder={t('cMsg')} value={cM} onChange={e=>setCM(e.target.value)}/><button className="btn" onClick={sendContact}>{t('send')}</button></div></div></div>
  </div>}
  </main>

  <footer><div className="wrap"><div className="g"><div><h4>{Ic('megaphone')} ShikayatBox</h4><p>{t('foot')}</p></div>
   <div><h4>{t('helpT')}</h4>{HELP.map(([k,n])=><a key={k} href={n}>{t(k)}</a>)}</div>
   <div><h4>{t('nHome')}</h4>{tabs.slice(1).map(([k,l])=><a key={k} href="#main" onClick={()=>go(k)}>{t(l)}</a>)}</div></div></div></footer>
  {tab!=='report'&&<button className="btn fab" onClick={()=>go('report')}>{Ic('send')} {t('nReport')}</button>}
  {toastM&&<div className={'toast'+(toastM.k==='e'?' e':'')}>{toastM.k==='e'?Ic('alert'):Ic('check')} {toastM.m}</div>}
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
